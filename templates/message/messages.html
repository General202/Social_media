{% extends 'home.html' %}
{% block content %}
<div class="container mt-4">
    <h2>Повідомлення</h2>
    <div class="list-group">
        {% for message in messages %}
            <a href="{% url 'message_detail' message.id %}" class="list-group-item list-group-item-action">
                <div class="d-flex w-100 justify-content-between">
                    <h5 class="mb-1">{{ message.sender.username }}</h5>
                    <small>{{ message.timestamp|date:"d M Y H:i" }}</small>
                </div>
                <p class="mb-1">{{ message.content|truncatewords:10 }}</p>
            </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
