<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Головна сторінка</title>
</head>
<body>
    <header>
        <h1>Ласкаво просимо на наш сайт</h1>
    </header>
    <main>
        {% block content %}
        <!-- Основний вміст сторінки буде тут -->
         <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">Соціальна мережа</a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Перемикач навігації">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Головна</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Профіль</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Повідомлення</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#">Вихід</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
        {% endblock %}
    </main>
    <footer>
        <p>&copy; 2025 Всі права захищені.</p>
    </footer>
    
</body>
</html>
